<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141c">
<title>NEON RECLAIMER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b141c;color:#e8edea;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}body{display:grid;place-items:center;overflow:hidden}main{width:min(100vw,177.777vh);aspect-ratio:16/9;position:relative;background:#101f2b;box-shadow:0 20px 100px #0008}canvas{display:block;width:100%;height:100%;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;background:radial-gradient(ellipse at 65% 30%,#254957,#0b141c 70%)}.eyebrow{font-size:12px;letter-spacing:.24em;color:#90b7bd}h1{font-weight:500;font-size:clamp(28px,5vw,66px);letter-spacing:.1em;margin:0}p{font-size:14px;line-height:1.8;color:#b3c4ca;margin:0;text-align:center}.track{height:3px;background:#30434b;width:min(300px,70%);margin-top:20px}.track span{display:block;height:100%;width:0;background:#e9b66e;transition:width .2s}#progress{font-size:12px;font-variant-numeric:tabular-nums;color:#a8bfc9}#fullscreen{position:absolute;left:50%;transform:translateX(-50%);top:10px;color:#c3d2d9;background:#10212cbf;border:1px solid #3b515b;padding:7px 12px;cursor:pointer;border-radius:3px;font-size:12px}#fullscreen:hover{background:#27424f}#error{display:none;position:absolute;inset:0;padding:12%;background:#101f2b;justify-content:center;align-items:center;text-align:center;flex-direction:column;gap:20px}#error button{background:#e9b66e;color:#111f28;border:0;padding:12px 22px;cursor:pointer}#mobile{display:none;position:absolute;bottom:14px;left:20px;right:20px;color:#edca97;font-size:13px;text-align:center}a{color:inherit}

html,body{overscroll-behavior:none}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;min-height:44px}
html.mobile,html.mobile body{height:100%;height:100dvh}
html.mobile main{width:100%;height:100%;aspect-ratio:auto;box-shadow:none}
html.mobile #fullscreen{display:block}
html.mobile #loading{padding:20px}
html.mobile h1{font-size:clamp(22px,5vw,42px)}
html.mobile #loading p{font-size:12px}
@media (max-height:440px){#loading{gap:10px}.track{margin-top:8px}}
#fullscreen{position:fixed;z-index:30;top:max(2px,env(safe-area-inset-top,0px));padding:4px 10px;min-height:36px;font-size:11px}
#fullscreen-help{max-width:min(440px,calc(100vw - 28px));padding:24px;border:1px solid #45606b;border-radius:10px;background:#10212c;color:#e8edea;box-shadow:0 12px 60px #000a}
#fullscreen-help::backdrop{background:#0009}#fullscreen-help h2{margin:0 0 14px;font-size:20px}#fullscreen-help p{text-align:left;white-space:pre-line}#fullscreen-help button{margin-top:20px;width:100%;border:0;border-radius:6px;background:#e8b775;color:#10212c;padding:10px}
</style></head>
<body><main id="game">
<canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="NEON RECLAIMER ゲーム画面"></canvas>
<div id="loading"><div class="eyebrow">3D ACTION / INCREMENTAL</div><h1>NEON RECLAIMER</h1><p>敵を倒してコインを集め、装備を強化。<br>剣と銃、支援ドローンで先のステージへ。</p><div class="track"><span id="bar"></span></div><div id="progress">読み込み中…</div><p id="input-hint" style="font-size:12px">キーボードとマウスで遊べます</p></div>
<button id="fullscreen" aria-label="全画面にする">全画面</button>
<div id="error"><h2>ゲームを読み込めませんでした</h2><p id="error-message">ページを再読み込みしてください。</p><button onclick="location.reload()">再読み込み</button></div>
<dialog id="fullscreen-help" aria-labelledby="fullscreen-help-title"><h2 id="fullscreen-help-title">全画面表示について</h2><p id="fullscreen-help-text"></p><button id="fullscreen-help-close">閉じる</button></dialog>
</main>
<script src="Build/WebGL.loader.js?v=barrier-balance-2"></script>
<script>
const canvas=document.getElementById('unity-canvas');let instance;
// iPadOS can identify as Mac. Do not treat every touch-capable laptop as a phone.
const mobileDevice=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
document.documentElement.classList.toggle('mobile',mobileDevice);
if(mobileDevice)document.getElementById('input-hint').textContent='画面のボタンで操作できます。横向きがおすすめです。';
// Keep browser zoom available; only the game surface owns touch gestures.
const renderDpr=Math.min(window.devicePixelRatio||1,mobileDevice?1.25:1.5);
canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}),{passive:true});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const fullscreenButton=document.getElementById('fullscreen');
const fullscreenHelp=document.getElementById('fullscreen-help');
const fullscreenElement=()=>document.fullscreenElement||document.webkitFullscreenElement;
function updateFullscreenButton(){const active=!!fullscreenElement();fullscreenButton.textContent=active?'全画面を解除':'全画面';fullscreenButton.setAttribute('aria-label',active?'全画面表示を解除する':'全画面表示にする');}
function showFullscreenHelp(unsupported){
 const apple=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 let text=unsupported?'ブラウザが全画面表示に対応していません。':'全画面表示を開始できませんでした。ブラウザの制限や設定を確認してください。';
 if(apple)text+='\n\nSafariの共有メニューから「ホーム画面に追加」を選び、「ウェブアプリとして開く」をオンにできる場合は、ホーム画面のアイコンからアドレスバーなしで開けます。OSによって項目や表示方法が異なります。';
 else text+='\n\n別の対応ブラウザで開くか、ブラウザのメニューに全画面表示がある場合はそちらをお試しください。';
 document.getElementById('fullscreen-help-text').textContent=text;
 if(fullscreenHelp.showModal)fullscreenHelp.showModal();else fullscreenHelp.setAttribute('open','');
}
document.getElementById('fullscreen-help-close').onclick=()=>{if(fullscreenHelp.close)fullscreenHelp.close();else fullscreenHelp.removeAttribute('open');};
fullscreenButton.onclick=async()=>{
 try{
  if(fullscreenElement()){
   const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document);
  }else{
   const target=document.documentElement,request=target.requestFullscreen||target.webkitRequestFullscreen;
   if(!request||(document.fullscreenEnabled===false&&!document.webkitFullscreenEnabled)){showFullscreenHelp(true);return;}
   await request.call(target);
  }
  updateFullscreenButton();
 }catch(error){console.warn('Fullscreen request failed',error);showFullscreenHelp(false);}
};
document.addEventListener('fullscreenchange',updateFullscreenButton);
document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
updateFullscreenButton();

createUnityInstance(canvas,{
 dataUrl:'Build/WebGL.data.unityweb?v=barrier-balance-2', frameworkUrl:'Build/WebGL.framework.js.unityweb?v=barrier-balance-2',codeUrl:'Build/WebGL.wasm.unityweb?v=barrier-balance-2',streamingAssetsUrl:'StreamingAssets',
 companyName:"Blueberry",productName:"NEON RECLAIMER",productVersion:"0.1.0",devicePixelRatio:renderDpr,
 autoSyncPersistentDataPath:true,
 showBanner:(message,type)=>{if(type==='error')console.error(message);else console.warn(message);}
},progress=>{document.getElementById('bar').style.width=(progress*100)+'%';document.getElementById('progress').textContent='読み込み中 '+Math.round(progress*100)+'%';}).then(game=>{instance=game;window.neonGame=game;setTimeout(()=>{if(mobileDevice)game.SendMessage('NEON RECLAIMER','SuggestTouchMode');if(new URLSearchParams(location.search).has('rendercheck'))game.SendMessage('NEON RECLAIMER','ReportRenderState');if(new URLSearchParams(location.search).has('safe'))game.SendMessage('NEON RECLAIMER','UseSafeWebRendering');},1500);document.getElementById('loading').style.display='none';if(!mobileDevice)canvas.focus({preventScroll:true});}).catch(error=>{console.error(error);document.getElementById('loading').style.display='none';document.getElementById('error').style.display='flex';});
</script></body></html>
