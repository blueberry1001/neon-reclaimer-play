<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b141c">
<title>NEON RECLAIMER</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b141c;color:#e8edea;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}body{display:grid;place-items:center;overflow:hidden}main{width:min(100vw,177.777vh);aspect-ratio:16/9;position:relative;background:#101f2b;box-shadow:0 20px 100px #0008}canvas{display:block;width:100%;height:100%;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;background:radial-gradient(ellipse at 65% 30%,#254957,#0b141c 70%)}.eyebrow{font-size:12px;letter-spacing:.24em;color:#90b7bd}h1{font-weight:500;font-size:clamp(28px,5vw,66px);letter-spacing:.1em;margin:0}p{font-size:14px;line-height:1.8;color:#b3c4ca;margin:0;text-align:center}.track{height:3px;background:#30434b;width:min(300px,70%);margin-top:20px}.track span{display:block;height:100%;width:0;background:#e9b66e;transition:width .2s}#progress{font-size:12px;font-variant-numeric:tabular-nums;color:#a8bfc9}#fullscreen{position:absolute;left:50%;transform:translateX(-50%);top:10px;color:#c3d2d9;background:#10212cbf;border:1px solid #3b515b;padding:7px 12px;cursor:pointer;border-radius:3px;font-size:12px}#fullscreen:hover{background:#27424f}#error{display:none;position:absolute;inset:0;padding:12%;background:#101f2b;justify-content:center;align-items:center;text-align:center;flex-direction:column;gap:20px}#error button{background:#e9b66e;color:#111f28;border:0;padding:12px 22px;cursor:pointer}#mobile{display:none;position:absolute;bottom:14px;left:20px;right:20px;color:#edca97;font-size:13px;text-align:center}a{color:inherit}
</style></head>
<body><main id="game">
<canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="NEON RECLAIMER ゲーム画面"></canvas>
<div id="loading"><div class="eyebrow">3D ACTION / INCREMENTAL</div><h1>NEON RECLAIMER</h1><p>敵を倒してコインを集め、装備を強化。<br>剣と銃、支援ドローンで先のステージへ。</p><div class="track"><span id="bar"></span></div><div id="progress">読み込み中…</div><p style="font-size:12px">キーボードとマウスで遊べます</p></div>
<button id="fullscreen" aria-label="全画面にする">全画面</button><div id="mobile">このゲームはキーボードとマウスが必要です。</div>
<div id="error"><h2>ゲームを読み込めませんでした</h2><p id="error-message">ページを再読み込みしてください。</p><button onclick="location.reload()">再読み込み</button></div>
</main>
<script src="Build/WebGL.loader.js"></script>
<script>
const canvas=document.getElementById('unity-canvas');let instance;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('fullscreen').onclick=()=>{if(instance)instance.SetFullscreen(1);};
if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))document.getElementById('mobile').style.display='block';
createUnityInstance(canvas,{
 dataUrl:'Build/WebGL.data.unityweb', frameworkUrl:'Build/WebGL.framework.js.unityweb',codeUrl:'Build/WebGL.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',
 companyName:"Blueberry",productName:"NEON RECLAIMER",productVersion:"0.1.0",devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
 autoSyncPersistentDataPath:true,
 showBanner:(message,type)=>{if(type==='error')console.error(message);else console.warn(message);}
},progress=>{document.getElementById('bar').style.width=(progress*100)+'%';document.getElementById('progress').textContent='読み込み中 '+Math.round(progress*100)+'%';}).then(game=>{instance=game;window.neonGame=game;setTimeout(()=>{if(new URLSearchParams(location.search).has('rendercheck'))game.SendMessage('NEON RECLAIMER','ReportRenderState');if(new URLSearchParams(location.search).has('safe'))game.SendMessage('NEON RECLAIMER','UseSafeWebRendering');},1500);document.getElementById('loading').style.display='none';canvas.focus();}).catch(error=>{console.error(error);document.getElementById('loading').style.display='none';document.getElementById('error').style.display='flex';});
</script></body></html>
